        <div  class="" style="padding: 10px 24px 0px 24px ;">


            <section class="py-5">
                <div class="container mt-3">
                    <div class="row">
                        <div class="col-60 col-md-auto text-center">
                            <img src="{{ urlBase+params.image}}" class="radius-15px w-300px">
                        </div>
                        <div class="col mt-5 mt-md-0 px-4 text-justify bg-autor radius-15px">
                            <h1>{{params.nombre}}</h1>
                            <p class="bio-author">{{params.biografia}}</p>
                        </div>
                    </div>
                </div>
            </section>
            <section class="p-0">
                <div class="container">
                    <h2>LIBROS DE {{params.nombre}}</h2>
                </div>
            </section>
            
           
           <div class="row list-table-container">
                <div class="col-sm-2 product-item" *ngFor="let card of dataSource.content">
                    <div class="card">
                        <div class="producto-transition">
                            <img class="card-img-top" src="{{ urlBase+card.image}}" alt="">
                            <a  class="product-image-link" (click)="OnClickDetailCliente(card)"></a>
                        </div>
                        <div  class="card-body pb-0">
                            <button *ngIf="rol == esAdmin" mat-icon-button  class="buttom-edit" (click)="onClickEditProducto(card)">
                                <mat-icon>edit</mat-icon>
                            </button>

                            <button *ngIf="rol == esAdmin" mat-icon-button  class="buttom-delete" (click)="OnClickDeleteProducto(card)">
                                <mat-icon>delete</mat-icon>
                            </button>
                            
                            <h6 class="mat-card-title">
                                {{card.nombre}}
                            </h6>
                            <p class="card-text product-author">
                                {{card.autor.nombre}}
                            </p>
                            <p class="product-price">
                                <span class="currency-symbol">₲</span>
                                <span class="price-amount pb-0"> {{card.precio}}</span>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        

        <mat-paginator
          [pageSizeOptions]="paginatorRange"
          [length]="dataSource.totalElements"
          [pageSize]="dataSource.pageable.pageSize"
          (page)="pageEvent = $event; onPaginateChange($event)"
          showFirstLastButtons #pagi>
        </mat-paginator> 
        

        

        

        

    </div>
</div>
