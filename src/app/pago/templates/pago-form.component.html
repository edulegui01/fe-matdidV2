<div class="titulo-detalle-container">
    <div class="titulo-detalle">REGISTRAR PAGO</div>
</div>

<div class="form-container">

    <form #formTemplate="ngForm" [formGroup]="entityForm" class="form mat-elevation-z2">
        <mat-grid-list [cols]="12" rowHeight="70px" gutterSize="0px" (window:resize)="onResize()">

        

            <mat-grid-tile [colspan]="6" [rowspan]="1">
                <mat-form-field>
                    <mat-label>TIPO DE PAGO</mat-label>
                    <mat-select formControlName="tipoPago" id="gestionSelect">
                        <mat-option>SELECCIONAR EL TIPO DE PAGO</mat-option>
                        <mat-option *ngFor="let tipoPago of listaTipoDePago" [value]="tipoPago">
                            {{tipoPago}}
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="entityForm.invalid">{{ getErrorMessage('tipoPago') }}</mat-error>
                </mat-form-field>
            </mat-grid-tile>

            <mat-grid-tile [colspan]="6" [rowspan]="1">
                <mat-form-field>
                    <mat-label>
                        SALDO
                    </mat-label>
                    <input mask="separator" thousandSeparator="." prefix="₲ " formControlName="saldo" matInput placeholder="SALDO" readonly>
                    <mat-error *ngIf="entityForm.invalid">
                        {{ getErrorMessage('saldo') }}
                    </mat-error>
                </mat-form-field>
            </mat-grid-tile>


            <mat-grid-tile [colspan]="6" [rowspan]="1">
                <mat-form-field>
                    <mat-label>FECHA</mat-label>
                       <input matInput formControlName="fecha" [matDatepicker]="picker" placeholder="FECHA" readonly>
                       <mat-datepicker #picker></mat-datepicker>
                    <mat-error *ngIf="entityForm.invalid">
                        {{ getErrorMessage('fecha') }}
                    </mat-error>
                </mat-form-field>
            </mat-grid-tile>
        

            <mat-grid-tile [colspan]="6" [rowspan]="1">
                <mat-form-field>
                    <mat-label>
                        MONTO
                    </mat-label>
                    <input mask="separator" thousandSeparator="." prefix="₲ " type="text" formControlName="monto" matInput placeholder="MONTO" required [readonly]="soloLectura">
                    <mat-error *ngIf="entityForm.invalid">
                        {{ getErrorMessage('monto') }}
                    </mat-error>
                </mat-form-field>
            </mat-grid-tile>


            

            
          <mat-grid-tile [colspan]="6" [rowspan]="2">
                <div class="motivo">
                    <mat-form-field>
                        <mat-label>
                            COMENTARIO
                        </mat-label>
                        <textarea formControlName="comentario" matInput placeholder=""></textarea>
                        <mat-error *ngIf="entityForm.invalid">
                            {{ getErrorMessage('comentario') }}
                        </mat-error>
                    </mat-form-field>
                </div>
            
            </mat-grid-tile>

 

        </mat-grid-list>
    </form>

    <div class="buttons-container">
        <button id="register"   mat-raised-button color="primary" type="button" (click)="savePago()">
            REGISTRAR
            <mat-icon>save</mat-icon>
        </button>
       
        <button type="button" mat-raised-button (click)="closeForm()">
            {{ viewText.CANCEL }}
            <mat-icon>clear</mat-icon>
        </button>
    </div>

</div>
