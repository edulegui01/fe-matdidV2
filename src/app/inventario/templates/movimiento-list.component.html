<div class="list-page">

    <div class="list-container mat-elevation-z4">

        <!-- <ng-container>
            
                <div [formGroup]="filterForm">
                    <mat-form-field appearance="outline" class="filter-input">
                        <input formControlName="cedula" matInput placeholder="BUSCAR POR ID">
                    </mat-form-field>
                </div>
            
        </ng-container>

        <ng-container matColumnDef="name-filter">
            <mat-header-cell *matHeaderCellDef>
                <div [formGroup]="filterForm">
                    <mat-form-field appearance="outline" class="filter-input">
                        <input formControlName="name" matInput placeholder="BUSCAR POR ID">
                    </mat-form-field>
                </div>
            </mat-header-cell>
        </ng-container> -->


        <mat-grid-list   cols="6" rowHeight="70px" gutterSize="0px" [style.backgroundColor]="'white'">
            <mat-grid-tile [colspan]="2">
                <div [formGroup]="filterForm" class="input-box">
                    <mat-form-field appearance="outline" class="input-box">
                        <mat-label>
                            <mat-icon>search</mat-icon>  BUSCAR POR EL NOMBRE DE LA CIUDAD
                        </mat-label>
                        <input formControlName="nombre-filter" matInput placeholder="INGRESE EL NOMBRE" (keydown.enter)="doFilter()">
                    </mat-form-field>
                </div>

            </mat-grid-tile>

           
            
        </mat-grid-list>

        

       <mat-table [dataSource]="dataSource.content"  class="list-table-container" matSort matSortActive="fecha"   matSortDisableClear matSortDirection="asc" fxLayout="row">
        <ng-container matColumnDef="fecha" >
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                FECHA
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{element.fecha}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="funcionario" >
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                FUNCIONARIO
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{element.nombreFuncionario}} {{element.apellidoFuncionario}}
            </mat-cell>
        </ng-container>



        <ng-container matColumnDef="tipo-movimiento" >
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                TIPO DE MOVIMIENTO
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{element.esIngreso ? "INGRESO": "SALIDA"}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="motivo" >
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                MOTIVO
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{element.motivo}}
            </mat-cell>
        </ng-container>

        

        
        

        <!--filters-->
       

        

        <div *ngIf="true">
            <ng-container matColumnDef="options">
                <mat-header-cell *matHeaderCellDef fxFlex="15%">

                    <span class="options-column">
                        OPCIONES
                    </span>

                    <button  matTooltip="OPCIONES DE TABLA"
                        class="config-table-btn-large" mat-flat-button>
                        OPCIONES
                    </button>

                    
                </mat-header-cell>
                <mat-cell *matCellDef="let element" fxFlex="15%">

                    <button mat-icon-button [matMenuTriggerFor]="actions">
                        <mat-icon aria-label="actions">
                            more_horiz
                        </mat-icon>
                    </button>

                    <mat-menu #actions>
                        <button mat-menu-item (click)="onClickDetailsMovimiento(element)">
                            <mat-icon class="mat-18">
                                navigate_next
                            </mat-icon>
                            DETALLE
                        </button>

                        <mat-divider></mat-divider>

                        <button mat-menu-item >
                            <mat-icon class="mat-18">
                                delete
                            </mat-icon>
                            ANULAR
                        </button>
                    </mat-menu>
                </mat-cell>
            </ng-container>
        </div>


        <mat-header-row *matHeaderRowDef="displayedColumns; "></mat-header-row>
        <!-- <mat-header-row *matHeaderRowDef="displayedFilters; " class="second-header-row"></mat-header-row> -->
        <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>

         <mat-paginator
          [pageSizeOptions]="paginatorRange"
          [length]="dataSource.totalElements"
          [pageSize]="dataSource.pageable.pageSize"
          (page)="pageEvent = $event; onPaginateChange($event)"
          showFirstLastButtons #pagi>
        </mat-paginator> 

    </div>
</div>
