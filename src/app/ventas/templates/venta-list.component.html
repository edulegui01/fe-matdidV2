<div class="list-page">

    <div class="list-container mat-elevation-z4">

        <div class="d-flex flex-row">
            <div class="p-2 input-filters">
                <div class="form-group " [formGroup]="filterForm">
                    <input formControlName="numFactura" (keydown.enter)="doFilter()" type="text" class="form-control" placeholder="Buscar por numero de folio">
                </div>
            </div>
            <div class="p-2 input-filters">
                <div class="form-group" [formGroup]="filterForm">
                    <input formControlName="cliente" (keydown.enter)="doFilter()" type="text" class="form-control" placeholder="Buscar por proveedor">
                </div>
            </div>
        </div>


        

       <mat-table [dataSource]="dataSource.content" class="list-table-container" matSort matSortActive="numFolio"   matSortDisableClear matSortDirection="desc">
        <ng-container matColumnDef="numFolio">
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                N° DE FOLIO
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                <p>
                    
                    <a class="link-opacity-100" style="cursor:pointer" (click)="OnDetailsVenta(element)">{{separarString(element.numFactura)}}</a>
                </p>
                
            </mat-cell>
        </ng-container>

        

        <ng-container matColumnDef="proveedor">
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                CLIENTE
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{element.razonSocial}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="fecha">
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                FECHA
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{formatFechaToList(element.fecha)}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="montoTotal">
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                MONTO
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                
                ₲{{formatearNumero(element.montoTotal)}}
            </mat-cell>
        </ng-container>

        <ng-container matColumnDef="estado">
            <mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                ESTADO
            </mat-header-cell>
            <mat-cell *matCellDef="let element">
                {{estados[element.estado]}}
            </mat-cell>
        </ng-container>

        <!--filters-->
       

        

        <div *ngIf="true">
            <ng-container matColumnDef="options">
                <mat-header-cell *matHeaderCellDef fxFlex="150%">

                    <span class="options-column">
                        OPCIONES
                    </span>

                    <button  matTooltip="OPCIONES DE TABLA"
                        class="config-table-btn-large" mat-flat-button>
                        OPCIONES
                    </button>

                    
                </mat-header-cell>
                <mat-cell *matCellDef="let element" fxFlex="15%">

                    <button mat-icon-button [matMenuTriggerFor]="actions">
                        <mat-icon aria-label="actions">
                            more_horiz
                        </mat-icon>
                    </button>

                    <mat-menu #actions>
                        <button mat-menu-item (click)="openCobroList(element)">
                            <mat-icon class="mat-18">attach_money</mat-icon>
                            COBROS
                        </button>

                        <mat-divider></mat-divider>

                        <button mat-menu-item (click)="OnClickDeleteCliente(element)" *ngIf="element.estado == 'SC' ">
                            <mat-icon class="mat-18">
                                remove_circle_outline
                            </mat-icon>
                            ANULAR
                        </button>

                        

                    </mat-menu>
                </mat-cell>
            </ng-container>
        </div>


        <mat-header-row *matHeaderRowDef="displayedColumns; "></mat-header-row>
        <!-- <mat-header-row *matHeaderRowDef="displayedFilters; " class="second-header-row"></mat-header-row> -->
        <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>

         <mat-paginator
          [pageSizeOptions]="paginatorRange"
          [length]="dataSource.totalElements"
          [pageSize]="dataSource.pageable.pageSize"
          (page)="pageEvent = $event; onPaginateChange($event)"
          showFirstLastButtons #pagi>
        </mat-paginator> 

    </div>
</div>
