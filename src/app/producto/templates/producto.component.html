<nav mat-tab-nav-bar updateActiveLink>

    <a mat-tab-link routerLink="listar-producto" (click)="linkActivateChange()" routerLinkActive routerLinkActive #rl1="routerLinkActive" [active]="rl1.isActive">
      LISTAR PRODUCTO
    </a>

    <ng-container *ngIf="esAdmin ==admin">
      <a mat-tab-link routerLink="nuevo-producto" (click)="productoService.detalleForm=false" *ngIf="!productoService.editForm" routerLinkActive #rl2="routerLinkActive" [active]="rl2.isActive">
        REGISTRAR PRODUCTO
      </a>
    </ng-container>
    
    <ng-container *ngIf="esAdmin ==admin">
      <a mat-tab-link routerLink="editar-producto" *ngIf="productoService.editForm" routerLinkActive #rl3="routerLinkActive" [active]="rl3.isActive">
        MODIFICAR PRODUCTO
      </a>
    </ng-container>


    <a mat-tab-link routerLink="detalle-producto" *ngIf="productoService.detalleForm" routerLinkActive #rl4="routerLinkActive" [active]="rl4.isActive">
      DETALLE DEL PRODUCTO
    </a>



  </nav>

  <router-outlet></router-outlet>
